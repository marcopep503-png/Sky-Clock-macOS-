name: Build apps

on:
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  release:
    types: [published]      # runs when you publish a GitHub Release

permissions:
  contents: write           # needed to attach files to a release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            name: SkyClock-Windows
            files: |
              dist/*.exe
          - os: macos-latest
            script: dist:mac
            name: SkyClock-macOS
            files: |
              dist/*.dmg
              dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # no Apple certificate, so the Mac app is built unsigned

      - name: Save the build as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
